name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks (secretos en historial del PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historial completo para escanear todos los commits del PR
      # Binario oficial en vez de gitleaks/gitleaks-action: la action exige
      # licencia (GITLEAKS_LICENSE) en repos de organizaciones.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Gitleaks scan
        run: ./gitleaks git --redact --verbose .

  semgrep:
    name: Semgrep (PHP SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install semgrep
        run: pip install --only-binary ":all:" semgrep==1.182.1
      # TODO(fase-1): cuando el repo central de pentesting tenga listas las
      # reglas custom (pentesting/semgrep-rules/), copiarlas a ./semgrep-rules/
      # en este repo y añadir `--config ./semgrep-rules/` al comando de abajo.
      - name: Semgrep scan
        run: semgrep scan --config p/php --config p/security-audit --metrics=off --error .

  pytest-security:
    name: pytest tests/test_security.py (Moodle en vivo)
    # tests/test_security.py hace peticiones HTTP a una instancia Moodle real
    # (MOODLE_URL, por defecto http://localhost:8888), así que NO puede correr
    # en PRs/push. Solo manual: Actions -> Security -> Run workflow, con la
    # variable de repo MOODLE_URL apuntando a una instancia accesible desde
    # el runner (o un runner self-hosted junto al Moodle de laboratorio).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install --only-binary ":all:" -r tests/requirements.txt
      - name: Run security tests
        env:
          MOODLE_URL: ${{ vars.MOODLE_URL }}
        run: pytest tests/test_security.py -v
